<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>物流面单扫描</title>
<style>
  :root {
    --bg: #f5f5f5;
    --card: #fff;
    --border: #e0e0e0;
    --text: #1a1a1a;
    --muted: #888;
    --accent: #4a90d9;
    --ok: #4caf50;
    --warn: #ff9800;
    --err: #f44336;
    --shadow: 0 1px 3px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 600px;
    margin: 0 auto;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  /* 标题栏 */
  header {
    background: var(--card);
    padding: 12px 16px;
    box-shadow: var(--shadow);
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 8px;
  }
  header h1 { font-size: 18px; font-weight: 600; flex: 1; }
  /* 摄像头区域 */
  .camera-section {
    position: relative;
    background: #000;
    aspect-ratio: 4/3;
    overflow: hidden;
  }
  #video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .scan-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .scan-frame {
    width: 70%; max-width: 280px;
    aspect-ratio: 2/1;
    border: 2px solid rgba(255,255,255,0.6);
    border-radius: 8px;
    position: relative;
  }
  .scan-line {
    position: absolute;
    left: 4px; right: 4px;
    height: 2px;
    background: var(--ok);
    box-shadow: 0 0 8px var(--ok);
    animation: scan-move 2s linear infinite;
  }
  @keyframes scan-move {
    0%, 100% { top: 10%; opacity: 0.6; }
    50% { top: 90%; opacity: 1; }
  }
  .scan-flash {
    position: absolute; inset: 0;
    background: var(--ok);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .scan-flash.active { opacity: 0.3; }
  .camera-placeholder {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #666; gap: 8px;
  }
  .camera-placeholder svg { width: 48px; height: 48px; opacity: 0.4; }
  .camera-placeholder p { font-size: 14px; }
  /* 控制按钮 */
  .controls {
    display: flex; gap: 8px; padding: 12px 16px;
    flex-wrap: wrap;
  }
  .controls button {
    flex: 1; min-width: 80px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--card);
    font-size: 14px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .controls button:active { background: var(--border); }
  .controls button.primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .controls button.primary:active { background: #3a7bc8; }
  .controls button.danger {
    color: var(--err); border-color: var(--err);
  }
  .controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  .torch-btn {
    position: absolute; top: 12px; right: 12px;
    background: rgba(0,0,0,0.5); color: #fff;
    border: none; border-radius: 50%;
    width: 40px; height: 40px;
    font-size: 18px; cursor: pointer; z-index: 10;
  }
  /* 统计 */
  .stats {
    display: flex; gap: 0; padding: 8px 16px;
    background: var(--card); margin-top: 1px;
    font-size: 13px; color: var(--muted);
  }
  .stats div { flex: 1; text-align: center; }
  .stats .num { font-size: 18px; font-weight: 700; color: var(--text); }
  .stats .num.ok { color: var(--ok); }
  .stats .num.warn { color: var(--warn); }
  /* 结果表 */
  .results-section {
    background: var(--card); margin-top: 8px;
    overflow-x: auto;
  }
  table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  th {
    padding: 8px 6px; text-align: left;
    border-bottom: 2px solid var(--border);
    color: var(--muted); font-weight: 500;
    white-space: nowrap;
  }
  td {
    padding: 8px 6px; border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr.row-invalid { background: #fff8e1; }
  .mono { font-family: "SF Mono", Consolas, monospace; font-size: 12px; }
  .tracking-edit {
    color: var(--ok); font-weight: 600; cursor: pointer;
  }
  .tracking-edit:hover { text-decoration: underline; }
  .tracking-input {
    width: 100%; max-width: 120px;
    border: 1px solid var(--accent); border-radius: 4px;
    padding: 2px 4px; font-size: 12px;
    font-family: "SF Mono", Consolas, monospace;
  }
  .tag {
    display: inline-block; padding: 1px 6px;
    border-radius: 4px; font-size: 11px; flex-shrink: 0;
  }
  .tag-warn { background: #fff3e0; color: var(--warn); }
  .tag-dup { background: #fce4ec; color: var(--err); }
  .note-input {
    width: 100%; max-width: 80px;
    border: 1px solid var(--border); border-radius: 4px;
    padding: 2px 4px; font-size: 12px;
  }
  .empty-hint {
    padding: 32px 16px; text-align: center; color: var(--muted);
    font-size: 14px;
  }
  /* Toast */
  .toast {
    position: fixed; bottom: 80px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 13px; z-index: 999;
    transition: opacity 0.3s;
  }
  .toast.hidden { opacity: 0; pointer-events: none; }
  .hidden { display: none !important; }
  .row-check { width: 18px; height: 18px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>📷 物流面单扫描</h1>
  <span style="font-size:11px;color:var(--muted)" id="engine-badge"></span>
  <span style="font-size:12px;color:var(--muted)" id="conn-status"></span>
</header>

<!-- 摄像头区域 -->
<div class="camera-section" id="camera-section">
  <video id="video" playsinline muted></video>
  <button class="torch-btn hidden" id="btn-torch" title="手电筒">🔦</button>
  <div class="scan-overlay" id="scan-overlay" style="display:none">
    <div class="scan-frame" id="scan-frame">
      <div class="scan-line"></div>
    </div>
  </div>
  <div class="scan-flash" id="scan-flash"></div>
  <div class="camera-placeholder" id="camera-placeholder">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
    <p>点击「启动扫描」打开摄像头</p>
    <p style="font-size:12px;color:#999">将摄像头对准面单条码/二维码</p>
  </div>
</div>

<!-- 控制按钮 -->
<div class="controls">
  <button class="primary" id="btn-start">▶ 启动扫描</button>
  <button id="btn-stop" disabled>⏹ 停止</button>
  <button id="btn-torch-toggle" disabled>🔦 闪光灯</button>
</div>
<div class="controls">
  <button id="btn-copy">📋 复制单号</button>
  <button id="btn-export">📊 导出CSV</button>
  <button id="btn-add-manual">✏ 新建</button>
  <button class="danger" id="btn-clear">🗑 删除</button>
</div>

<!-- 统计 -->
<div class="stats">
  <div><div class="num" id="stat-total">0</div>总计</div>
  <div><div class="num ok" id="stat-ok">0</div>成功</div>
  <div><div class="num warn" id="stat-warn">0</div>待校验</div>
</div>

<!-- 结果表 -->
<div class="results-section">
  <table>
    <thead>
      <tr>
        <th></th>
        <th>日期</th>
        <th>物流单号</th>
        <th>备注</th>
        <th>状态</th>
      </tr>
    </thead>
    <tbody id="result-body"></tbody>
  </table>
  <div class="empty-hint" id="empty-hint">暂无扫描结果，启动摄像头开始扫描</div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
